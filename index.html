<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Portfolio links for Utkarsh Panchal - Graphic Designer and 3D Artist.">
    <title>Utkarsh Panchal | Portfolio Links</title>
    <style>
        :root {
            --text: #ffffff;
            --card-text: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.95);
            --overlay: rgba(6, 10, 24, 0.45);
            --ring: rgba(255, 255, 255, 0.6);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Tahoma, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--text);
            background: #0a1022;
        }

        body {
            display: grid;
            place-items: start center;
            padding: 28px 14px;
            background-image:
                linear-gradient(var(--overlay), var(--overlay)),
                url("static/images/background.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .page {
            width: min(440px, 100%);
            display: grid;
            gap: 14px;
        }

        .hero {
            text-align: center;
            padding: 12px 14px 6px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 14px;
            border: 2px solid var(--ring);
            box-shadow: var(--shadow);
        }

        h1 {
            margin: 0;
            font-size: clamp(1.85rem, 5.2vw, 2rem);
            letter-spacing: 0.02em;
        }

        .subtitle {
            margin: 8px 0 4px;
            font-size: 1rem;
            line-height: 1.45;
            opacity: 0.95;
        }

        .section-label {
            margin: 8px 0 2px;
            text-align: center;
            font-family: "Trebuchet MS", TrebuchetMS, Helvetica, sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .links {
            display: grid;
            gap: 10px;
        }

        .link-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            border-radius: 999px;
            background: var(--card-bg);
            color: var(--card-text);
            text-decoration: none;
            box-shadow: var(--shadow);
            transition: transform 140ms ease, box-shadow 140ms ease;
        }

        .link-card:hover,
        .link-card:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.34);
        }

        .icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            flex: 0 0 28px;
            display: grid;
            place-items: center;
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1;
            color: #ffffff;
        }

        .icon-behance {
            background: #1769ff;
        }

        .icon-artstation {
            background: #ffffff;
        }

        .icon-youtube {
            background: #ff0000;
        }

        .icon-linkedin {
            background: #0a66c2;
        }

        .icon-instagram {
            background: linear-gradient(135deg, #405de6, #c13584 55%, #f77737 80%, #ffdc80);
        }

        .icon-facebook {
            background: #1877f2;
        }

        .label {
            font-size: 1rem;
            font-weight: 500;
            word-break: break-word;
        }

        .cta {
            margin: 10px 0 0;
            text-align: center;
            font-family: "Trebuchet MS", TrebuchetMS, Helvetica, sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.45;
        }

        .thanks {
            margin: 8px 0 0;
            text-align: center;
            font-family: "Trebuchet MS", TrebuchetMS, Helvetica, sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            padding-bottom: 6px;
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .qr-label {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        #qrcode {
            background: white;
            padding: 8px;
            border-radius: 8px;
            position: relative;
            display: inline-block;
        }

        #qrcode::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 56px;
            height: 56px;
            background: white;
            border-radius: 4px;
            background-image: url("static/images/github-mark.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            padding: 6px;
        }

        @media (max-width: 420px) {
            body {
                padding: 20px 10px;
            }

            .link-card {
                padding: 14px 16px;
            }

            .label {
                font-size: 0.96rem;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <header class="hero">
            <a href="tel:+919910360864" aria-label="Call +91 99103 60864">
                <img class="avatar" src="static/images/avatar.jpg" alt="Utkarsh Panchal profile photo" loading="lazy">
            </a>

            <a class="link-card" href="https://www.behance.net/utkarshpanchal3" target="_blank"

            <a class="link-card" href="https://utkarshpanchal7.artstation.com/" target="_blank"

                    <img src="static/icons/artstation.png" alt="ArtStation" width="22" height="22"
                        style="display:block;" />
                </span>
                <span class="label">utkarshpanchal7</span>
            </a>

            <a class="link-card" href="https://www.youtube.com/@utkarshpanchal4860" target="_blank"
                rel="noopener noreferrer">
                <span class="icon icon-youtube" aria-hidden="true">
                    <img src="static/icons/youtube.svg" alt="YouTube" width="22" height="22" style="display:block;" />
                </span>

            </a>
        </section>

        <p class="cta">Explore the following links<br>to learn more:</p>

        <section class="links" aria-label="Social links">
            <a class="link-card" href="https://www.linkedin.com/in/utkarsh-panchal-aab4a7273/" target="_blank"
                rel="noopener noreferrer">
                <span class="icon icon-linkedin" aria-hidden="true">in</span>
                <span class="label">utkarsh-panchal</span>

            <a class="link-card" href="https://www.instagram.com/utkarshpanchal47/" target="_blank"
                rel="noopener noreferrer">
                <span class="icon icon-instagram" aria-hidden="true">
                    <img src="static/icons/instagram.svg" alt="Instagram" width="22" height="22"

                </span>
                <span class="label">@utkarshpanchal47</span>
            </a>

            <a class="link-card" href="https://www.facebook.com/utkarsh.panchal.5602" target="_blank"
                rel="noopener noreferrer">
                <span class="icon icon-facebook" aria-hidden="true">f</span>
                <span class="label">utkarsh.panchal</span>
            </a>
        </section>

        <p class="thanks">Thank You for visiting</p>

        <div class="qr-section">
            <p class="qr-label">Scan to visit</p>
            <div id="qrcode"></div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: "https://utkarshpanchal47.github.io",
            width: 256,
            height: 256,
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>

</html>
